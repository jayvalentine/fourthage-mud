services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fourthage
      POSTGRES_USER: mud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    image: ghcr.io/jayvalentine/fourthage-mud:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fourthage
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
