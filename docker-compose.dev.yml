services:
  db:
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fourthage"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: .          # build locally instead of pulling image
    ports:
      - "8080:8080"
    volumes:
      - ${MUD_DATA_DIR}:/app/data
